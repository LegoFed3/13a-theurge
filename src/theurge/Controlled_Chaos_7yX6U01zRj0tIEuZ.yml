      description:
        type: String
        value: <p>Choose one of <em>Attack</em>, <em>Defense</em> or <em>Iconic</em>;
          whenever you draw such a stone also roll on the High Weirdness table. You
          can now alter an active High Weirdness effect with a quick action.</p>
