  effect:
    label: Effect
    type: String
    value: "<p>You gain the Chaos Mage @UUID[Compendium.archmage.chaosmage.Item.dPXy4n8yIsFkudTD]{High\
      \ Weirdness}  class feature, and you can cast a single Chaos Mage spell per\
      \ full heal up, and a second one from 5th level. As long as you have Chaos Mage\
      \ spell uses remaining, at the end of each of your turns, draw a stone as if\
      \ you were a Chaos Mage. During your next turn you can cast a Chaos Mage spell\
      \ you have access to according to the stone you drew. If you opt (or are forced)\
      \ not to cast it, at the end of that turn you can choose whether to draw another\
      \ stone or keep your current one for later. Since Chaos Mage spells are based\
      \ on Charisma, you might want to avoid this talent if yours isn\u2019t very\
      \ high.</p>"
  embeddedMacro:
    label: Embedded Macro
    type: String
    value: ''
  feats:
