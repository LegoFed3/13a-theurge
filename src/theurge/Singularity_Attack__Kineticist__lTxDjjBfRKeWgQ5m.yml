    value: >-
      If the target wasn’t already engaged with the singularity it is pulled
      into engagement with it (if it makes sense for its size, otherwise it’s at
      least *dazed* as the weird side-pulling gravity messes with its
      movements). Creatures that start their turn engaged with the singularity
      take [[max(@int.dmg, @wis.dmg, @cha.dmg)]] damage of a type you have
      access to (probably force) and must succeed on a disengage check  to move
      away from it.
