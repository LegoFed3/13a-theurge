  effect:
    label: Effect
    type: String
    value: "<p>Your main attacks are your magic basic attacks (@UUID[Compendium.13a-theurge.theurge.Item.fOp22gFqZWWX6vDp]{Magic\
      \ Ranged attack}, @UUID[Compendium.13a-theurge.theurge.Item.ebsNfS56jCKjAspw]{Magic\
      \ Melee attack}). These count as basic attacks for the purpose of things like\
      \ making opportunity attacks (or a commander or bard granting you extra basic\
      \ attacks), but also as spells for the purposes of <em>Counter-spell</em> or\
      \ the <em>Hindered</em> condition.</p><p>Your talents modify your magic basic\
      \ attacks, and are designed so that you can apply multiple such talents to a\
      \ single basic attack at the same time. You gain all of the talent\u2019s benefits\
      \ for that attack, and penalties and bonuses to e.g. damage die size stack.\
      \ So, for example, an attack benefitting from both <em>Mystical Might</em> and\
      \ <em>Mass Enchantment</em> would increase the damage die size by a single stage.\
      \ Feel free to prepare a name for each combination of talents and possibly damage\
      \ type you have, if you\u2019d like. You can use your magic attacks when you\
      \ need to make a no-trigger attack, but you can\u2019t activate any of your\
      \ talents in conjunction with a no-trigger attack.</p>"
