          <p>If you choose two damage types, you can pick a number of additional
          types equal to your level, up to all of them; when you next advance in
          level after picking this feat you can make a new choice, and so on.
          Feel free to roll randomly to determine the damage type of your
          attacks if you feel like it, but you don’t have to. If instead you
