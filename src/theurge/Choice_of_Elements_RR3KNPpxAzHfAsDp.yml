  effect:
    label: Effect
    type: String
    value: '<p>Choose <strong>two</strong> types of damage for your attacks: <em>acid</em>,
      <em>cold</em>, <em>fire</em>, <em>force</em>, <em>holy</em>, <em>lightning</em>,
      <em>necro</em>, <em>poison</em>, <em>psychic</em> and <em>thunder</em> (and,
      if it makes sense for your kind of magic, <em>untyped</em> damage, or any other
      type not on the list). You can deal damage of either of these types with your
      magic basic attacks, which normally target PD. <em>Psychic</em> is a little
      special: your magic attacks dealing psychic damage target MD instead of PD,
      but also deal slightly less damage: you do not add any ability score modifier
      to damage when attacking MD. This is to account for the fact that MD is usually
      the easiest defense to hit, and it roughly balances out in terms of average
      damage output. Feel free to target MD with any other damage type you feel is
      appropriate for your character, but if you do you suffer the same penalty. </p><p>Alternatively,
      you can choose to specialize in a single damage type. If you do so, you can
      ignore resist 16+ or lower to that type.</p>'
  embeddedMacro:
    label: Embedded Macro
    type: String
    value: ''
  feats:
    '0':
      description:
        type: String
        value: "<p>If you choose two damage types, you can pick a number of additional\
          \ types equal to your level, up to all of them; when you next advance in\
          \ level after picking this feat you can make a new choice, and so on. Feel\
          \ free to roll randomly to determine the damage type of your attacks if\
          \ you feel like it, but you don\u2019t have to. If instead you chose a single\
          \ type, you can ignore resist 18+ or lower to that one type.</p>"
