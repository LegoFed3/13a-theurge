  effect:
    label: Effect
    type: String
    value: "<p>A number of times per full heal-up equal to your Charisma modifier\
      \ (minimum 1), you can as a free action add [[/r 1d6]] to one of your attack\
      \ rolls. Yes, this is supposed to be used after you roll, to hopefully let you\
      \ turn a miss into a hit. You can only add a single d6 per attack (e.g. up to\
      \ once per target, if you are using this multiple times in conjunction with\
      \ <em>Mass Enchantment</em>), and you can\u2019t use it on a nat. 1.</p>"
