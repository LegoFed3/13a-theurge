    '1':
      description:
        type: String
        value: <p>(Disruptive Summon) Once per battle, when your summon hits a target
          with a natural even hit it can either make it *stuck* (save ends) or deal
          [[max(@int.dmg, @wis.dmg, @cha.dmg)]] ongoing damage to it.</p>
      isActive:
        type: Boolean
        value: false
      maxQuantity:
        type: Number
        value: 1
      powerUsage:
        type: String
        value: once-per-battle
      quantity:
        type: Number
        value: 1
      tier:
        type: String
        value: adventurer
    '2':
      description:
        type: String
        value: "<p>(Many Summons) You can use this talent even if it's expended, but\
          \ doing so costs you a recovery for each \u201Cextra\u201D summon you conjure\
          \ up (you can only have one summon active at a time).</p>"
      isActive:
        type: Boolean
        value: false
      maxQuantity:
        type: Number
        value: null
      powerUsage:
        type: String
        value: ''
      quantity:
        type: Number
        value: null
      tier:
        type: String
        value: champion
    '3':
      description:
        type: String
        value: <p>(Expert Summoner) You no longer need to succeed on a save to command
          your summon to attack, and it gets a +5 bonus to its skill checks to attempt
          other tasks.</p>
      isActive:
        type: Boolean
        value: false
      maxQuantity:
