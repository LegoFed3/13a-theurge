  effect:
    type: String
    label: Effect
    value: >-
      <p>Once per battle or scene you can use a standard action to summon a
      spirit or elemental next to you. This action provokes opportunity attacks
      and can’t be used while hindered, like a ranged spell would. Describe your
      summon in any way that makes sense for your character. The summon has your
      defenses and no hit points, and it dissipates harmlessly if it takes any
      damage or at the end of the battle or scene, whichever comes first.
      </p><p>The summon counts as your ally if it's convenient, but can’t be
      healed. It uses your actions, and generally moves when you do to stay next
      to its conjurer. As an interrupt action, you can have your summon
      intercept a foe moving to engage you, stopping its movement and
      redirecting its attack to itself (it might be destroyed, but it stopped
      that foe’s movement and took one for the team, so it was hardly useless).
      Alternatively, as a quick action on your turn (including the turn you
      summoned it on) you can make an easy save to attempt to command your
      summon to attack a nearby enemy (and move to engage said enemy in the
      process). On a success it does so, using your own magic attacks (that
      means it gets to use the E.D. and inherits your magic item bonuses, but
      not any bonus or penalty currently affecting you but not it). It can even
      use your other talents, just as if you were attacking yourself, but note
      that any uses it consumes count against your totals. You might even be
      able to order your summon to move and attempt to accomplish something
      other than attacking, but it will probably require a skill check to
      achieve anything worthwhile (use that in place of the save). </p>
