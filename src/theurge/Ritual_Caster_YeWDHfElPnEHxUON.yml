  effect:
    type: String
    label: Effect
    value: >-
      <p>You are a ritual caster, but since you (mostly) lack the structure of
      spells or prayers, your attempts at ritual magic must cost a different
      resource. If you take a talent that lets you borrow spells from another
      class you can expend those, as usual. Most of the time, however, that
      won’t be an option; in such cases one (or more) of your recoveries is
      likely to be a sufficient sacrifice to perform a lasting magical work of
      some kind (see HH:198 for more on rituals, the GM has final say on the
      cost). Should your skill check fail while performing the ritual, giving up
      another recovery might let you fail forward and succeed (if that is the
      direction your GM wants to take the story). As usual, more potent rituals
      may require the expenditure of gold or magic items or other unique
      resources to achieve extraordinary effects.</p>
