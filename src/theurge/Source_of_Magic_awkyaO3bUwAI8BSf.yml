  effect:
    label: Effect
    type: String
    value: "<p>The source of your magic can be arcane, divine, or even both (or perhaps\
      \ neither and something weirder). You can choose to use either arcane or divine\
      \ implements and gain their bonuses to attack and damage; if your story mixes\
      \ these two types of magic, perhaps you can use both, though of course only\
      \ one bonus applies at a time (so if you have both a magic wand and a magic\
      \ holy symbol, use the best attack and damage bonus between the two but don\u2019\
      t add them up). In any case, their bonuses apply to all of your magic basic\
      \ attacks and to any spell you borrow from other classes via your talents. Eventually\
      \ you would be able to do so anyway with a magic staff, but if you prefer the\
      \ aesthetics of some other implement, go along with your imagination. It won\u2019\
      t hurt a thing.</p><p>You must, however, choose the ability score you use to\
      \ make your <em>magic</em> basic attacks. Your choice is between Intelligence,\
      \ Wisdom and Charisma (which, you\u2019ll notice, are the same ability scores\
      \ this class can give a bonus to). Intelligence improves talents that let you\
      \ attack multiple targets or otherwise mess with them, Wisdom talents that let\
      \ you heal or aid your allies, and Charisma works best alongside talents that\
      \ improve your damage. Wisdom is likely to contribute to your AC, as well.</p>"
