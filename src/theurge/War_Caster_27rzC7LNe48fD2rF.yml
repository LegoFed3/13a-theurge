  effect:
    type: String
    label: Effect
    value: >-
      <p>Reduce the penalty you suffer for using armor (not shields) by 2, and
      raise your AC in no armor by 2. Phrase this as actual armor or magical
      shielding, as you prefer.</p><p>In addition, your basic <em>magic</em>
      melee attack damage die size increases by two stages, usually from d4s to
      d8s, and deals damage equal to your level on a miss. Phrase it as
      short-range magic or a big flaming weapon or however makes sense for your
      character. You can also cast any ranged spell you may have borrowed from
      other classes, or use your
      @UUID[Compendium.13a-theurge.theurge.Item.mNj9b5w7H85yFIRt]{Conjurer}
      talent if you have it, without triggering opportunity
      attacks.</p><p>However, your basic magic attacks damage (not attack!)
      bonus is now based on your Constitution, instead of your Intelligence,
      Wisdom or Charisma. You’ll need the HP to survive in melee.</p>
