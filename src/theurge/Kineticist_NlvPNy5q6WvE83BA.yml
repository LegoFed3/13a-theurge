  effect:
    label: Effect
    type: String
    value: "<p>Your <em>magic</em> attacks have a chance of pushing enemies back.\
      \ Whenever you hit with a natural 16+ on a <em>magic</em> attack vs. PD the\
      \ target is pushed away from you (up to somewhere nearby their current position)\
      \ barring any obstacle that would prevent that movement, such as walls or other\
      \ creatures (including your allies). This movement provokes opportunity attacks\
      \ from your allies, but they only deal half their normal damage. The GM might\
      \ adjudicate that particularly large targets can only be pushed around with\
      \ a natural 18+ roll, or otherwise you might only be able to push one of their\
      \ (giant) limbs away, not their whole body. Fliers, on the other hand, might\
      \ be easier to knock off course (natural 14+) unless they\u2019re also massive\
      \ (e.g. dragons).</p>"
  embeddedMacro:
    label: Embedded Macro
    type: String
    value: ''
  feats:
    '0':
      description:
        type: String
        value: '<p>(Move Ally): As a move action once per turn you can push (or pull,
          with the feat below!) an ally instead; roll an easy save, on a success the
          target pops free from all engagements and moves away from (or towards) you
          as if it had successfully disengaged and moved.</p>'
      isActive:
        type: Boolean
        value: false
      maxQuantity:
        type: Number
        value: null
      powerUsage:
        type: String
        value: ''
      quantity:
        type: Number
        value: null
      tier:
        type: String
        value: adventurer
    '1':
      description:
        type: String
        value: <p>(Pull) You can choose to pull enemies toward you, instead of pushing
          them away.</p>
      isActive:
        type: Boolean
        value: false
      maxQuantity:
        type: Number
        value: null
      powerUsage:
        type: String
        value: ''
      quantity:
        type: Number
        value: null
      tier:
        type: String
        value: adventurer
    '2':
      description:
        type: String
        value: "<p>(Warp) You can choose to reduce the target\u2019s AC and PD by\
          \ 2 points (stacks up to -4) instead of moving them, as your power twists\
          \ their armor (or scales, or\u2026) revealing weak spots.</p>"
      isActive:
        type: Boolean
        value: false
      maxQuantity:
        type: Number
        value: null
      powerUsage:
        type: String
        value: ''
      quantity:
        type: Number
        value: null
      tier:
        type: String
        value: champion
    '3':
      description:
        type: String
        value: <p>Once per full heal up, you can as a standard action that draws opportunity
          attacks conjure a small immobile singularity somewhere nearby, which pulls
          nearby foes (and probably unsecured items in the vicinity) to itself for
          the duration of the battle (or scene). Once during each of your turns you
          can make the TODO attack as a free action.</p>
      isActive:
        type: Boolean
        value: false
