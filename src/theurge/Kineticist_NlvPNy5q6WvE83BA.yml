  effect:
    type: String
    label: Effect
    value: >-
      <p>Your <em>magic</em> attacks have a chance of pushing enemies back.
      Whenever you hit with a natural 16+ on a <em>magic</em> attack vs. PD the
      target is pushed away from you (up to somewhere nearby their current
      position) barring any obstacle that would prevent that movement, such as
      walls or other creatures (including your allies). This movement provokes
      opportunity attacks from your allies, but they only deal half their normal
      damage. The GM might adjudicate that particularly large targets can only
      be pushed around with a natural 18+ roll, or otherwise you might only be
      able to push one of their (giant) limbs away, not their whole body.
      Fliers, on the other hand, might be easier to knock off course (natural
      14+) unless they’re also massive (e.g. dragons).</p>
