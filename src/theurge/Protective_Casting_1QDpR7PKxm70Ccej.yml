  effect:
    label: Effect
    type: String
    value: "<p>Once per encounter, as an interrupt action you may add a +4 bonus to\
      \ your own or an ally\u2019s AC. This is intended to let you negate a hit, and\
      \ we assume the GM will let you know whether the bonus would actually help or\
      \ not. If it doesn\u2019t, feel free to reuse this talent later in the battle\
      \ (but you still burned your interrupt action this round, sorry).</p>"
