  effect:
    type: String
    label: Effect
    value: >-
      <p>You gain the Druid’s
      @UUID[Compendium.archmage.druid.Item.IPHBUYHirDAPCONw]{Nature Talking}
      class feature, and once per full heal up you can cast a daily (arc)
      <em>Terrain Caster</em> spell as if you were a <em>Terrain Caster</em>
      Druid. From 5th level onward you can also cast a second daily <em>Terrain
      Caster</em> spell. Since those spells are based on Wisdom, avoid this
      talent if your Wisdom score isn’t up to par. If you also have the
      @UUID[Compendium.13a-theurge.theurge.Item.mNj9b5w7H85yFIRt]{Conjurer}
      talent you can call beasts to your aid in addition to spirits and
      elementals. You can (probably) manipulate the weather using rituals.</p>
