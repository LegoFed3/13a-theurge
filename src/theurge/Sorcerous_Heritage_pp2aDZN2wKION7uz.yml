  effect:
    type: String
    label: Effect
    value: >-
      <p>Once per battle you can spend your standard action to <em>Gather
      Power</em> like a Sorcerer. You can then cast the <em>Surge Shield</em>
      overspill effect (2e) or gain a
      @UUID[Compendium.archmage.system-rolltables.RollTable.PQbtKGZVFy83A85d]{Chaotic
      Benefit} (1e). The next spell you cast or magic attack you make has its
      effect doubled: this includes doubling its damage, hit or miss, but also
      doubling its positive effects such as healing or temporary hit points, so
      you could use it to double the healing (but not the cost) of a use of your
      @UUID[Compendium.13a-theurge.theurge.Item.yiXqeGkJA7Ldubim]{Touch of
      Healing} talent, for example, or gain double the attack bonus from that
      <em>Bless</em> spell you learned from your
      @UUID[Compendium.13a-theurge.theurge.Item.4ZtKg1Tj6QuvOctE]{Priestly
      Training}. You also gain one sorcerer arc or recharge spell of your
      choice, which you can change after each full heal-up. Note that you are
      not limited to casting sorcerer spells after gathering power, your magical
      flexibility lets you cast any spell you may know. Also, since sorcerer
      spells use Charisma as their attack score, you might want to avoid this
      talent unless you have a decent score in that attribute or plan to borrow
      a non-attack spell.</p>
