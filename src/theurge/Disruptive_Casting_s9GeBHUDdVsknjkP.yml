  effect:
    label: Effect
    type: String
    value: <p>Once per battle plus a number of times per full heal-up equal to your
      Intelligence modifier (minimum 1), declare you are using this talent before
      attacking a target with one of your magic attacks. If you are attacking multiple
      targets with a single action (e.g. via @UUID[Compendium.13a-theurge.theurge.Item.8Q01nlZkSs7qt2HB]{Mass
      Enchantment}), you can burn multiple uses of this talent at once, one per target.
      If your attack(s) hit, the target becomes *dazed* (save ends) or on a natural
      16+ roll it can become either *hindered* (save ends) or *stuck* (save ends)
      instead if you prefer.</p>
  embeddedMacro:
    label: Embedded Macro
    type: String
    value: ''
  feats:
    '0':
      description:
        type: String
        value: <p>On a natural 16+, the target can become *weakened* or *vulnerable*
          (save ends) instead; alternatively, you can apply two conditions (single
          save ends both) instead of just one.</p>
      isActive:
        type: Boolean
