    '1':
      description:
        type: String
        value: "<p>Once per battle you can use this talent in conjunction with any\
          \ kind of magical attack, including borrowed spells (that roll at least\
          \ one attack vs. enemies), and this single use can affect multiple targets\
          \ if it\u2019s a multi-target attack (e.g. a <em>Mass Enchantment</em> magic\
          \ attack).</p>"
      isActive:
