  effect:
    type: String
    label: Effect
    value: >-
      <p>Once per battle plus a number of times per full heal-up equal to your
      Intelligence modifier (minimum 1) you may choose to target [[1d3+1]]
      targets in a group with your <em>magic</em> basic attack. However, the
      size of the damage die for this attack drops by one, usually from d8 to
      d6. This implies you normally can’t use this talent for a magic melee
      attack; unless you have means to increase your magic melee attack damage
      die size, you’re going to have to use your ranged attack even while
      engaged to use this talent.</p>
