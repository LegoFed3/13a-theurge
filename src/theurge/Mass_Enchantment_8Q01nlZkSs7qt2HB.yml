      tier:
        type: String
        value: adventurer
    '1':
      description:
        type: String
        value: <p>Before rolling for targets, you can choose to make your mass <em>magic</em>
          attack a <em>reckless</em> one; add [[1d4]] targets, but each time you miss
          deal [[2*@lvl]] in damage to an ally engaged with the missed target, or
          a random nearby ally if none are engaged. Increase this to [[3*@lvl]] damage
          if you also used @UUID[Compendium.13a-theurge.theurge.Item.QZkfgeMESTSgsrLc]{Mystical
          Might} on this attack.</p>
      isActive:
        type: Boolean
        value: false
      maxQuantity:
        type: Number
        value: null
      powerUsage:
        type: String
        value: ''
      quantity:
        type: Number
        value: null
      tier:
        type: String
        value: champion
    '2':
      description:
        type: String
        value: <p>Once per battle, after rolling to determine the number of targets,
          you can add another target when you use this talent. In addition, one of
          the targets no longer has to be in the same group as the others, just within
          reach of your magic.</p>
      isActive:
        type: Boolean
        value: false
