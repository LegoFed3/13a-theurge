  effect:
    label: Effect
    type: String
    value: "<p>Once per battle plus a number of times per full heal-up equal to your\
      \ Intelligence modifier (minimum 1) you may choose to target [[1d3+1]] targets\
      \ in a group with your <em>magic</em> basic attack. However, the size of the\
      \ damage die for this attack drops by one, usually from d8 to d6. This implies\
      \ you normally can\u2019t use this talent for a magic melee attack; unless you\
      \ have means to increase your magic melee attack damage die size, you\u2019\
      re going to have to use your ranged attack even while engaged to use this talent.</p>"
  embeddedMacro:
    label: Embedded Macro
    type: String
    value: ''
  feats:
    '0':
      description:
        type: String
        value: <p>Once per battle, ignore the damage die size penalty from this talent
          when you use it.</p>
      isActive:
        type: Boolean
        value: false
      maxQuantity:
        type: Number
        value: 1
      powerUsage:
