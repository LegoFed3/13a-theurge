  effect:
    label: Effect
    type: String
    value: '<p>Once per full heal up, your scrying magic or connection to the gods
      gives you a vision of the future. When you or one of your nearby allies spends
      an Icon advantage, you can predict the upcoming complications and avert them:
      the roll to avoid complications automatically succeeds (2e) or a 5 turns into
      a (trouble-free) 6 (1e).</p><p>Alternatively, you can ask the GM to make a blind
      normal save (11+) so that you do not see the result: on a success, you receive
      a prophecy/vision that truthfully answers a question you ask of the GM that
      you could conceivably have scryed. On a failure, you may receive no answer,
      just gibberish, or possibly the GM might lie.</p><p>In addition, once per battle
      you can declare that you had a vision of an attack that is about to be rolled
      which includes you as a target, then roll a normal save (11+); on a success
      you (and only you) had just enough foresight to avoid the attack entirely, it
      has no effect against you if it makes sense at all.</p>'
  embeddedMacro:
    label: Embedded Macro
    type: String
    value: ''
  feats:
    '0':
      description:
        type: String
        value: <p>You can use the arc ability of this talent twice per full heal up.</p>
      isActive:
