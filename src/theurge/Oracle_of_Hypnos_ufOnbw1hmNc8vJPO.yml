    '1':
      description:
        type: String
        value: >-
          <p>Your foresight becomes precocious enough that now you can warn an
          ally as an interrupt action, letting them avoid an attack instead of
          you (the attack needs to include them among its targets, but not
          necessarily you as well).</p>
      isActive:
        type: Boolean
