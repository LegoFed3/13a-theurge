        value: adventurer
    '1':
      description:
        type: String
        value: <p>Your foresight becomes precocious enough that now you can warn an
          ally as an interrupt action, letting them avoid an attack instead of you
          (the attack needs to include them among its targets, but not necessarily
          you as well).</p>
      isActive:
        type: Boolean
        value: false
      maxQuantity:
        type: Number
        value: null
      powerUsage:
        type: String
        value: ''
      quantity:
        type: Number
        value: null
      tier:
        type: String
        value: champion
    '2':
      description:
        type: String
        value: "<p>Once per full heal up gain foreknowledge about an impending fumble\
          \ by you or one of your allies. After you or one of your allies rolls a\
          \ nat. 1 you can declare you had foreseen this and warned against that course\
          \ of action; the forewarned therefore never attempted whatever triggered\
          \ this ability (or, if they decide they did anyway, nothing happens but\
          \ you don\u2019t expend the use of this feat), but must take a different\
          \ course of action. For example,  if they fumbled a skill check they must\
          \ attempt something different using a different background or do nothing\
          \ if it's an option; if they fumbled an attack they cannot attack the same\
          \ target or attempt to use the same power or spell, etc.</p>"
      isActive:
        type: Boolean
        value: false
