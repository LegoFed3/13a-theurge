  effect:
    label: Effect
    type: String
    value: "<p>You can sacrifice the life force of another in place of your own to\
      \ empower your rituals. That means you can use a recovery from one of your allies\
      \ instead of yours; circumstances will dictate whether it has to be offered\
      \ or you can forcibly extract it, though in the latter case you might not remain\
      \ allies for much longer. Alternatively, you could sacrifice the life force\
      \ of an enemy you captured after defeating them in battle (GM decides if a mook\
      \ suffices, or how many are required), but that\u2019s very likely to put your\
      \ character onto the path of becoming an NPC antagonist rather than a hero.\
      \ Oh, and you can cast the Necromancer spell @UUID[Compendium.archmage.necromancer.Item.b75sdYCZPkVxhUAP]{Summon\
      \ Undead} at your level. From 5th level onward you can also cast @UUID[Compendium.archmage.necromancer.Item.9WoAxfUDTmsaQnGQ]{Speak\
      \ with Dead}. If you have the @UUID[Compendium.13a-theurge.theurge.Item.mNj9b5w7H85yFIRt]{Conjurer}\
      \ talent, you can summon (raise) corporeal undead with it.</p>"
  embeddedMacro:
    label: Embedded Macro
    type: String
    value: ''
