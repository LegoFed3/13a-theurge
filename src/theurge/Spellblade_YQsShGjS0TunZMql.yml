  effect:
    label: Effect
    type: String
    value: "<p>You can use one-handed d6 melee weapons without penalty, and can use\
      \ your choice of Intelligence, Wisdom or Charisma for melee attack (not damage!)\
      \ rolls, and your Constitution for melee damage (not attack!) rolls.</p><p>When\
      \ you make a basic melee (not magic!) attack, on a natural 11+ you can also\
      \ make a close-quarters ranged magic attack against one nearby foe as a free\
      \ action, but that attack\u2019s damage dice is reduced by one size (usually\
      \ from d8s to d6s).</p>"
  embeddedMacro:
    label: Embedded Macro
    type: String
    value: ''
  feats:
    '0':
      description:
        type: String
        value: <p>Once per battle you can trigger the magic ranged attack on a natural
          2+, but its damage die drops one size further (usually from d6s to d4s).</p>
      isActive:
