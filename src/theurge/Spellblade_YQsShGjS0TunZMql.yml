    '1':
      description:
        type: String
        value: "<p>Once per full heal up you can cast a spell you know (from talents\
          \ such as <em>Sorcerous Heritage</em>, <em>Priestly Trainin</em>g or <em>Wizardly\
          \ Schooling</em>) that isn\u2019t already expended instead of making a magic\
          \ ranged attack, without penalties to its damage die size.</p>"
